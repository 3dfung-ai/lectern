<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lectern</title>
<meta name="description" content="Your talks, from the first idea to the podium. Works offline; syncs through your own Google Drive.">
<meta name="theme-color" content="#1C2230">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
@font-face { font-family: 'Lectern Serif'; src: url('vendor/serif.woff2') format('woff2'); font-weight: 200 900; font-style: normal; font-display: swap; }
@font-face { font-family: 'Lectern Serif'; src: url('vendor/serif-italic.woff2') format('woff2'); font-weight: 200 900; font-style: italic; font-display: swap; }
:root {
  --bg: #F2F3EF; --panel: #FFFFFF; --panel2: #E8EAE4; --ink: #1C2230; --mut: #5D6573; --rule: #D3D6CE; --rule2: #BFC3BA;
  --brass: #8C5E0E; --brass-fill: #B57A16; --brass-soft: #F3E7CF; --on-brass: #FFFFFF;
  --page: #FFFDF8; --page-ink: #22252C; --page-rule: #E6DCC6;
  --stage: #1A1B1E; --stage-ink: #C9CCD2;
  --ok: #2F7D55; --warn: #B4531F; --bad: #B3261E; --ahead: #2F5F9E;
  --shadow: 0 1px 2px rgba(28,34,48,.08), 0 8px 24px rgba(28,34,48,.08);
  --sans: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --serif: 'Lectern Serif', Charter, Georgia, serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme=light]) {
  --bg: #15171B; --panel: #1D2026; --panel2: #262A31; --ink: #E7E6E1; --mut: #9AA0A8; --rule: #2E323A; --rule2: #3B4049;
  --brass: #E0A93A; --brass-fill: #C98E22; --brass-soft: #3A2F1A; --on-brass: #17130B;
  --page: #211F1A; --page-ink: #ECE5D5; --page-rule: #3A3326;
  --stage: #0F1012; --stage-ink: #9CA2AB;
  --ok: #5CC28C; --warn: #F08A4B; --bad: #F2685E; --ahead: #7AA7E8;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35); color-scheme: dark; } }
:root[data-theme=dark] {
  --bg: #15171B; --panel: #1D2026; --panel2: #262A31; --ink: #E7E6E1; --mut: #9AA0A8; --rule: #2E323A; --rule2: #3B4049;
  --brass: #E0A93A; --brass-fill: #C98E22; --brass-soft: #3A2F1A; --on-brass: #17130B;
  --page: #211F1A; --page-ink: #ECE5D5; --page-rule: #3A3326;
  --stage: #0F1012; --stage-ink: #9CA2AB;
  --ok: #5CC28C; --warn: #F08A4B; --bad: #F2685E; --ahead: #7AA7E8;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35); color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--sans); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--brass); }
.ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ic.fill { fill: currentColor; stroke: none; }
.ic.big { width: 34px; height: 34px; stroke-width: 1.5; }
kbd { font: 600 11px/1 var(--sans); padding: 3px 5px; border-radius: 4px; border: 1px solid var(--rule2); border-bottom-width: 2px; color: var(--mut); background: var(--panel); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--brass-fill); outline-offset: 2px; }
.mut { color: var(--mut); } .small { font-size: 13px; } .warn { color: var(--warn); }
.hint { color: var(--mut); font-size: 13px; }
.link { background: none; border: 0; padding: 0; color: var(--brass); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
code { font-family: Consolas, ui-monospace, monospace; font-size: 13px; }

/* buttons */
.btn { display: inline-flex; align-items: center; gap: 8px; min-height: 38px; padding: 7px 14px; border: 1px solid var(--rule2); border-radius: 7px; background: var(--panel); color: var(--ink); cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: var(--mut); }
.btn.primary { background: var(--brass-fill); border-color: var(--brass-fill); color: var(--on-brass); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.primary kbd { background: transparent; color: inherit; border-color: currentColor; opacity: .7; }
.btn.quiet { background: transparent; border-color: transparent; }
.btn.quiet:hover { background: var(--panel2); }
.btn.danger { color: var(--bad); }
.btn.small { min-height: 30px; padding: 4px 10px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }
.btn.tog.on { background: var(--brass-soft); color: var(--brass); border-color: transparent; }
.iconbtn { display: inline-grid; place-items: center; width: 32px; height: 32px; border: 0; border-radius: 6px; background: transparent; color: var(--mut); cursor: pointer; }
.iconbtn:hover { background: var(--panel2); color: var(--ink); }

/* frame */
#app { min-height: 100%; }
#main { min-height: 100vh; }
.pill { position: fixed; left: 14px; bottom: 14px; z-index: 30; display: flex; align-items: center; gap: 7px; padding: 6px 12px 6px 10px; border: 1px solid var(--rule); border-radius: 999px; background: var(--panel); color: var(--mut); font-size: 13px; cursor: pointer; box-shadow: var(--shadow); }
.pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--mut); }
.pill.ok i { background: var(--ok); } .pill.warn i { background: var(--warn); } .pill.busy i { background: var(--brass-fill); animation: pulse 1.2s infinite; } .pill.off i { background: var(--rule2); }
@keyframes pulse { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
.in-deck .pill { bottom: auto; top: auto; left: auto; right: 14px; bottom: 14px; }
#toasts { position: fixed; right: 16px; top: 16px; z-index: 90; display: grid; gap: 8px; max-width: min(440px, calc(100vw - 32px)); }
.toast { display: flex; align-items: center; gap: 10px; padding: 11px 8px 11px 14px; border-radius: 8px; background: var(--ink); color: var(--bg); box-shadow: var(--shadow); font-size: 14px; }
.othertab { position: fixed; left: 50%; transform: translateX(-50%); bottom: 18px; z-index: 95; display: flex; align-items: center; gap: 10px; padding: 9px 10px 9px 16px; border-radius: 10px; background: var(--panel); color: var(--ink); border: 1px solid var(--rule2); box-shadow: var(--shadow); font-size: 14px; max-width: calc(100vw - 32px); }
.toast.warn { background: var(--warn); color: #fff; }
.toast span { flex: 1; }
.toast .tbtn { border: 1px solid currentColor; background: transparent; color: inherit; border-radius: 5px; padding: 3px 9px; cursor: pointer; font-weight: 600; }
.toast .tx { border: 0; background: none; color: inherit; opacity: .7; cursor: pointer; padding: 2px; display: grid; }
#tray { position: fixed; left: 14px; bottom: 54px; z-index: 31; width: min(360px, calc(100vw - 28px)); display: grid; gap: 6px; }
.in-deck #tray { left: auto; right: 14px; }
.titem { padding: 10px 12px; border-radius: 8px; background: var(--panel); border: 1px solid var(--rule); box-shadow: var(--shadow); font-size: 13px; }
.titem .tline { display: flex; gap: 8px; justify-content: space-between; } .titem .tline span { color: var(--mut); text-align: right; }
.titem b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 60%; }
.titem.err { border-color: var(--warn); } .titem.err span { color: var(--warn); } .titem.done span { color: var(--ok); }
.titem.bg { opacity: .9; }
.bar { height: 4px; margin-top: 7px; border-radius: 2px; background: var(--panel2); overflow: hidden; } .bar i { display: block; height: 100%; background: var(--brass-fill); transition: width .3s; }
body.dragging::after { content: 'Drop to add to Lectern'; position: fixed; inset: 12px; z-index: 95; display: grid; place-items: center; border: 3px dashed var(--brass-fill); border-radius: 16px; background: color-mix(in srgb, var(--bg) 88%, transparent); color: var(--brass); font: 600 28px var(--serif); pointer-events: none; }

/* dialogs */
.scrim { position: fixed; inset: 0; z-index: 80; display: grid; place-items: start center; padding: 8vh 16px 16px; background: rgba(12,14,18,.45); overflow: auto; }
.modal { width: min(560px, 100%); border-radius: 12px; background: var(--panel); box-shadow: 0 24px 80px rgba(0,0,0,.35); }
.modal.wide { width: min(940px, 100%); }
.mhead { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px 6px 22px; }
.mhead h2 { margin: 0; font: 600 21px/1.25 var(--serif); }
.mbody { padding: 8px 22px 6px; }
.mbody textarea, .mbody input[type=text], .mbody input[type=url], .mbody input[type=search], .mbody input[type=password], .mbody input[type=number], .mbody input[type=date], .mbody select, .plan input, .plan textarea, .plan select { width: 100%; padding: 9px 11px; border: 1px solid var(--rule2); border-radius: 7px; background: var(--bg); }
.mfoot { display: flex; gap: 8px; justify-content: flex-end; padding: 14px 22px 18px; flex-wrap: wrap; }
.form { display: grid; gap: 14px; margin: 8px 0 14px; } .form label { display: grid; gap: 5px; } .form label > span { font-weight: 600; font-size: 14px; } .form small { color: var(--mut); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 10px 0; }
.callout { display: flex; gap: 14px; align-items: center; justify-content: space-between; padding: 12px 14px; margin: 8px 0 14px; border-radius: 8px; background: var(--brass-soft); }
.callout p { margin: 0; }
.menu { position: fixed; z-index: 85; min-width: 240px; padding: 6px; border: 1px solid var(--rule); border-radius: 9px; background: var(--panel); box-shadow: var(--shadow); display: grid; }
.menu button { padding: 9px 12px; border: 0; border-radius: 6px; background: none; text-align: left; cursor: pointer; }
.menu button:hover, .menu button:focus { background: var(--panel2); outline: none; }
.tagpill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; background: var(--panel2); color: var(--mut); font-size: 12px; border: 0; }
.tagpill .ic { width: 13px; height: 13px; }
.tagpill.flagged { background: var(--brass-soft); color: var(--brass); cursor: pointer; } .tagpill.edited { background: var(--brass-soft); color: var(--brass); }

/* the four steps */
.rail { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; border: 1px solid var(--rule); border-radius: 10px; background: var(--panel); overflow: hidden; }
.rail.five { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.step { position: relative; display: grid; grid-template-columns: auto 1fr; column-gap: 9px; align-items: center; padding: 10px 14px; border: 0; border-left: 1px solid var(--rule); background: none; text-align: left; cursor: pointer; min-width: 0; }
.step:first-child { border-left: 0; }
.step:hover { background: var(--panel2); }
.step .sn { grid-row: span 2; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--rule2); color: var(--mut); font-weight: 700; font-size: 13px; }
.step.done .sn { background: var(--ok); border-color: var(--ok); color: #fff; }
.step.part .sn { border-color: var(--brass-fill); color: var(--brass); }
.step .sname { font-weight: 650; display: flex; align-items: center; gap: 6px; }
.step .sm { font-style: normal; color: var(--mut); font-weight: 400; }
.step .sdet { grid-column: 2; color: var(--mut); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; gap: 8px; }
.step .sdet .got { color: var(--ok); }
.step.improve .sn { border-style: dashed; }
.step.improve.has .sn { border: 0; background: var(--brass-fill); color: var(--on-brass); }
.badge { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--brass-fill); color: var(--on-brass); font-size: 12px; }
.prog { display: flex; align-items: center; gap: 10px; } .prog .segs { flex: 1; display: grid; grid-auto-flow: column; gap: 3px; } .prog .segs i { height: 5px; border-radius: 3px; background: var(--rule); } .prog .segs i.done { background: var(--ok); } .prog .segs i.part { background: var(--brass-fill); }
.prog .at { font-size: 12.5px; color: var(--mut); white-space: nowrap; display: flex; gap: 6px; align-items: center; }
.focus .rail .sdet { display: none; } .focus .rail .step { padding: 10px 12px; }
.rail.compact { border: 0; background: none; gap: 4px; display: flex; }
.rail.compact .step { padding: 0; border: 0; display: flex; gap: 4px; cursor: default; background: none; font-size: 12px; }
.rail.compact .step .sn { width: 18px; height: 18px; font-size: 10px; border-width: 1.5px; }
.rail.compact .step .sname { font-weight: 500; color: var(--mut); font-size: 12px; } .rail.compact .step .sm { display: none; }
.rail.compact .step + .step::before { content: ''; width: 10px; height: 1px; background: var(--rule2); margin-right: 2px; align-self: center; }
.next { display: flex; align-items: center; gap: 12px; padding: 10px 2px 0; }
.next .nl { font: 600 13px var(--sans); color: var(--brass); }
.next .nt { flex: 1; min-width: 0; }

/* library */
.libhead { max-width: 1320px; margin: 0 auto; padding: 34px 28px 10px; }
.brandrow { display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap; }
.brand { margin: 0; font: 600 44px/1 var(--serif); letter-spacing: -.01em; }
.tag { margin: 0; color: var(--mut); flex: 1; }
.headbtns { display: flex; gap: 4px; }
.searchrow { display: flex; gap: 12px; margin-top: 22px; }
.search { flex: 1; display: flex; align-items: center; gap: 10px; padding: 0 14px; height: 48px; border: 1px solid var(--rule2); border-radius: 10px; background: var(--panel); }
.search input { flex: 1; border: 0; background: transparent; outline: none; font-size: 16px; height: 100%; }
.searchrow .btn { min-height: 48px; padding: 0 20px; }
#libbody { max-width: 1320px; margin: 0 auto; padding: 8px 28px 90px; }
.focus { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 28px; align-items: center; margin: 18px 0 30px; padding: 24px; border-radius: 14px; background: var(--panel); border: 1px solid var(--rule); }
.focus .fk { margin: 0 0 4px; color: var(--brass); font-weight: 600; }
.focus h2 { margin: 0 0 16px; font: 600 30px/1.15 var(--serif); }
.focus .factions { margin-top: 14px; }
.focus .fpic { cursor: pointer; border-radius: 8px; overflow: hidden; box-shadow: var(--shadow); }
.group { margin-top: 26px; }
.ghead { display: flex; align-items: baseline; gap: 12px; padding: 0; border: 0; background: none; cursor: pointer; margin-bottom: 14px; }
.ghead h2 { margin: 0; font: 600 23px var(--serif); }
.ghead .gcount { color: var(--mut); }
.ghead[aria-expanded=false] h2::after { content: ' ▸'; color: var(--mut); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }
.card { border-radius: 11px; background: var(--panel); border: 1px solid var(--rule); overflow: hidden; cursor: pointer; transition: border-color .15s, transform .15s; }
.card:hover { border-color: var(--rule2); transform: translateY(-1px); }
.card .cbody { padding: 12px 14px 14px; display: grid; gap: 8px; }
.card h3 { margin: 0; font: 600 18px/1.25 var(--serif); }
.card .meta { margin: 0; color: var(--mut); font-size: 13px; display: flex; flex-wrap: wrap; gap: 0 4px; align-items: center; }
.card .resume { margin-left: auto; color: var(--brass); font-weight: 600; }
.card .cnext { margin: 0; font-size: 13px; color: var(--mut); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pic { position: relative; width: 100%; background: var(--panel2); overflow: hidden; }
.pic img { display: block; width: 100%; height: 100%; object-fit: contain; }
.pic.textpic { display: grid; place-items: center; padding: 6%; background: var(--panel2); container-type: inline-size; }
.pic .tp { text-align: center; color: var(--mut); overflow: hidden; } .pic .tp b { display: block; color: var(--ink); font: 600 clamp(9px, 6cqw, 26px)/1.2 var(--serif); overflow-wrap: anywhere; } .pic .tp p { white-space: pre-line; font-size: clamp(8px, 2.6cqw, 15px); }
.empty { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 30px; margin-top: 24px; }
.drop-hero { display: grid; place-items: center; align-content: center; gap: 6px; min-height: 340px; padding: 30px; border: 2px dashed var(--rule2); border-radius: 16px; text-align: center; cursor: pointer; color: var(--mut); }
.drop-hero:hover { border-color: var(--brass-fill); color: var(--brass); }
.drop-hero h2 { margin: 6px 0 0; font: 600 28px var(--serif); color: var(--ink); }
.drop-hero p { max-width: 380px; margin: 0; }
.how h3 { font: 600 21px var(--serif); margin: 0 0 12px; }
.loop { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.loop li { display: grid; grid-template-columns: 34px 1fr; gap: 12px; }
.loop .hn { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--brass-soft); color: var(--brass); }
.loop strong { font-size: 16px; } .loop p { margin: 2px 0 0; color: var(--mut); }
.results h2 { font: 600 20px var(--serif); margin: 24px 0 12px; }
.hits { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; }
.hit { display: grid; grid-template-columns: 150px 1fr; gap: 12px; padding: 10px; border: 1px solid var(--rule); border-radius: 9px; background: var(--panel); text-align: left; cursor: pointer; }
.hit:hover { border-color: var(--rule2); }
.hit .pic { border-radius: 5px; }
.hit .hk { margin: 0; font-size: 12.5px; color: var(--mut); } .hit .hk span { color: var(--ink); font-weight: 600; }
.hit .hs { margin: 4px 0 0; font-size: 13.5px; }
mark { background: var(--brass-soft); color: inherit; padding: 0 1px; border-radius: 2px; }
.none { color: var(--mut); padding: 40px 0; }

/* one talk */
.deck { display: flex; flex-direction: column; height: 100vh; }
.dhead { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 14px; padding: 10px 18px; border-bottom: 1px solid var(--rule); background: var(--panel); }
.crumbs { display: flex; align-items: center; gap: 8px; min-width: 0; white-space: nowrap; }
.crumb { color: var(--mut); text-decoration: none; overflow: hidden; text-overflow: ellipsis; }
.crumb.home { display: inline-flex; align-items: center; gap: 4px; color: var(--ink); font: 600 17px var(--serif); }
.crumbs .sep { color: var(--rule2); font-style: normal; }
.dtitle { min-width: 0; overflow: hidden; text-overflow: ellipsis; padding: 2px 4px; border: 0; border-radius: 5px; background: none; font: 600 17px var(--serif); cursor: text; }
.dtitle:hover { background: var(--panel2); }
.tabs { display: flex; padding: 3px; border-radius: 9px; background: var(--panel2); }
.tab { display: flex; align-items: center; gap: 8px; padding: 7px 18px; border: 0; border-radius: 7px; background: none; color: var(--mut); font-weight: 600; cursor: pointer; }
.tab kbd { opacity: .7; }
.tab.on { background: var(--panel); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.dtools { display: flex; justify-content: flex-end; gap: 2px; }
.railrow { padding: 12px 18px 12px; border-bottom: 1px solid var(--rule); background: var(--bg); }
.work { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 34%); }
.work:has(.script[hidden]) { grid-template-columns: minmax(0, 1fr); }
.stagecol { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--stage); }
.stage { position: relative; flex: 1; min-height: 0; display: grid; place-items: center; padding: 18px 64px; }
.stage:fullscreen { background: #000; padding: 0; }
.slidebox { width: 100%; max-height: 100%; display: grid; place-items: center; cursor: pointer; container-type: size; height: 100%; }
.slidebox .pic.main { width: auto; height: auto; max-width: 100%; max-height: 100%; aspect-ratio: 16/9; width: min(100cqw, calc(100cqh * 16 / 9)); box-shadow: 0 10px 40px rgba(0,0,0,.45); background: #fff; }
.slidebox .pic.main.textpic { background: #2A2C31; } .slidebox .pic.main.textpic .tp, .slidebox .pic.main.textpic .tp b { color: #E3E3E3; }
.navbtn { position: absolute; top: 50%; transform: translateY(-50%); display: grid; place-items: center; width: 44px; height: 64px; border: 0; border-radius: 8px; background: rgba(255,255,255,.06); color: var(--stage-ink); cursor: pointer; }
.navbtn:hover { background: rgba(255,255,255,.14); color: #fff; }
.navbtn.prev { left: 10px; } .navbtn.next { right: 10px; }
.navbtn .ic { width: 26px; height: 26px; }
.fsbtn { position: absolute; right: 12px; top: 10px; border: 0; background: none; color: var(--stage-ink); cursor: pointer; padding: 6px; border-radius: 6px; }
.fsbtn:hover { color: #fff; background: rgba(255,255,255,.1); }
.underbar { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 14px; align-items: center; padding: 10px 16px; background: var(--panel); border-top: 1px solid var(--rule); }
.counter { display: flex; align-items: center; gap: 8px; min-width: 0; }
.counter { white-space: nowrap; } .counter b { font: 600 20px var(--serif); } .counter .of { color: var(--mut); }
.counter .ct { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--mut); margin-left: 6px; }
.acts { display: flex; gap: 8px; }
.acts .act-edit, .acts .act-flag { border-color: var(--brass-fill); color: var(--brass); font-weight: 600; }

.views { display: flex; gap: 2px; }
